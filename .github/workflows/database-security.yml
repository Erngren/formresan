name: Database security
on:
  pull_request:
    paths:
      - 'supabase/**'
      - 'tests/database-security.cjs'
      - 'tests/package*.json'
      - '.github/workflows/database-security.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: formresan_test_ci
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - '127.0.0.1:5432:5432'
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tests/package-lock.json
      - run: npm ci --prefix tests
      - run: node --test tests/database-security.cjs
        env:
          FORMRESAN_TEST_DATABASE_URL: postgresql://postgres@127.0.0.1:5432/formresan_test_ci

name: Isolated RPC retry diagnosis
on:
  pull_request:
    paths:
      - 'supabase/migrations/**'
      - 'tests/rpc-*.cjs'
      - '.github/workflows/rpc-retry-diagnosis.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  local-postgrest-14:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: formresan_test_rpc_retry
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - '127.0.0.1:5432:5432'
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --prefix tests
      - run: node --test tests/rpc-revision-migration.cjs
      - run: node tests/rpc-retry-local.cjs --isolated-ci
        env:
          FORMRESAN_RPC_TEST_URL: postgresql://postgres@127.0.0.1:5432/formresan_test_rpc_retry

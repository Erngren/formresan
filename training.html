<!doctype html><html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0D1117"><title>Formresan · Träning v1.4</title><style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#f0f6fc;background:#0d1117}*{box-sizing:border-box}body{margin:0}main{max-width:720px;margin:auto;padding:20px 14px 70px}h1{font-size:27px;margin:6px 0}h2{font-size:19px}.muted{color:#8b949e}.small{font-size:13px}.card{background:#161b22;border:1px solid #30363d;border-radius:16px;padding:16px;margin:12px 0}.row{display:flex;align-items:center;justify-content:space-between;gap:9px}.wrap{flex-wrap:wrap}button{border:0;border-radius:10px;padding:11px 13px;background:#1f6feb;color:white;font:inherit;font-weight:650;cursor:pointer}.secondary{background:#30363d}.active{outline:2px solid #58a6ff}input{background:#0d1117;border:1px solid #30363d;color:white;border-radius:9px;padding:10px;font:inherit;width:100%}.set{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;align-items:end;margin:8px 0}.set label{font-size:12px;color:#8b949e}.exercise{border-top:1px solid #30363d;padding:14px 0}.exercise:first-child{border:0}dialog{border:1px solid #30363d;border-radius:16px;background:#161b22;color:white;width:min(94vw,520px);max-height:90vh;overflow:auto;padding:18px}dialog::backdrop{background:#000b}.pic{width:100%;border-radius:12px}.tip{border-left:3px solid #58a6ff;padding:8px 12px;background:#0d1117}.check{width:22px;height:22px;accent-color:#58a6ff}.hidden{display:none}a{color:#58a6ff}.history{padding:10px 0;border-bottom:1px solid #30363d}.tag{color:#8b949e;font-size:12px}button:focus-visible{outline:2px solid white} .sets{margin:10px 0} .counter{font-size:13px;color:#8b949e} 
</style></head><body><main><div class="row"><div><div class="muted small">FORMRESAN · TRÄNING</div><h1>💙 Version 1.4</h1></div><a href="./">← Tillbaka</a></div><p class="muted small">Förhandsversion av träningsdelen. Din gamla Formresan och dess data påverkas inte.</p><div class="row wrap" id="tabs"><button data-r="a">💪 Pass A</button><button data-r="b">💪 Pass B</button><button data-r="warm">⛳ Före golf</button><button data-r="mob">🧘 Rörlighet</button></div><div id="content"></div><div class="card"><div class="row"><h2>📈 Senaste passen</h2><button class="secondary" onclick="download()">Exportera träning</button></div><div id="history"></div></div><dialog id="guide"><div id="guideBody"></div><button class="secondary" onclick="guide.close()">Stäng</button></dialog></main><script>
const EXERCISES=[{id:"legpress",name:"Benpress",sets:"3 × 8–12",tip:"Pressa genom hela foten. Sänk så långt du kan utan att bäckenet rullar upp.",desc:"Sitt stadigt, placera fötterna axelbrett och pressa plattan kontrollerat.",emoji:"🦵"},{id:"chest",name:"Bröstpress i maskin",sets:"3 × 8–12",tip:"Håll skuldrorna stabila och undvik att låsa armbågarna hårt.",desc:"Justera sätet så handtagen hamnar ungefär i brösthöjd. Pressa fram och återgå långsamt.",emoji:"🏋️"},{id:"row",name:"Sittande kabelrodd",sets:"3 × 8–12",tip:"Dra armbågarna bakåt utan att gunga med överkroppen.",desc:"Sitt upprätt och dra handtaget mot nedre delen av bröstkorgen.",emoji:"🚣"},{id:"rdl",name:"Rumänska marklyft med hantlar",sets:"2 × 8–10",tip:"Skjut höften bakåt och håll ryggen neutral. Du behöver inte nå golvet.",desc:"Håll hantlar nära låren, mjuka knän, fäll i höften och res dig kontrollerat.",emoji:"🏋️"},{id:"deadbug",name:"Dead bug",sets:"2 × 8–10/sida",tip:"Håll ländryggen stabil och rör dig långsamt.",desc:"Ligg på rygg med armar upp och knän i 90°. Sträck motsatt arm och ben, växla.",emoji:"🧘"},{id:"squat",name:"Knäböj till bänk",sets:"3 × 8–12",tip:"Använd en bänkhöjd där rörelsen känns trygg.",desc:"Stå axelbrett, för höften bakåt tills du lätt nuddar bänken, res dig.",emoji:"🪑"},{id:"pulldown",name:"Latsdrag",sets:"3 × 8–12",tip:"Dra mot övre bröstet utan att luta dig långt bakåt.",desc:"Greppa stången, sänk axlarna och dra armbågarna nedåt.",emoji:"💪"},{id:"shoulder",name:"Axelpress med hantlar",sets:"2 × 8–12",tip:"Pressa kontrollerat utan att överdriva svanken.",desc:"Sitt med stöd, starta hantlar vid axelhöjd och pressa upp.",emoji:"🏋️"},{id:"curl",name:"Lårcurl i maskin",sets:"3 × 10–15",tip:"Justera maskinens led efter knäleden.",desc:"Böj knäna mot motståndet och återgå långsamt.",emoji:"🦵"},{id:"pushup",name:"Armhävningar mot bänk",sets:"2 × 8–12",tip:"Håll kroppen rak; välj högre stöd om det är tungt.",desc:"Händer på stadig bänk, böj armbågarna och pressa upp.",emoji:"💪"},{id:"thoracic",name:"Stående bröstryggsrotation",sets:"10/sida",tip:"Rotera lugnt i överkroppen utan att tvinga fram rörelsen.",desc:"Stå stadigt med armarna korsade över bröstet och vrid åt varje håll.",emoji:"🔄"},{id:"hipcircles",name:"Höftcirklar",sets:"10/håll",tip:"Små mjuka cirklar räcker som start.",desc:"Stå upprätt och gör kontrollerade cirklar med höfterna.",emoji:"⭕"},{id:"armcircles",name:"Armcirklar",sets:"10 fram + 10 bak",tip:"Börja med små cirklar och öka efter hand.",desc:"Sträck armarna åt sidorna och gör cirklar åt båda håll.",emoji:"🙆"},{id:"legswings",name:"Benpendlingar",sets:"10/ben",tip:"Håll i ett stöd och pendla utan att rycka.",desc:"Pendla ett ben framåt och bakåt i bekvämt rörelseomfång.",emoji:"🦵"},{id:"swings",name:"Lugna övningssvingar",sets:"8–10",tip:"Börja med halvsvingar och öka gradvis.",desc:"Gör långsamma svingar utan boll, gärna med golfklubban.",emoji:"⛳"},{id:"openbook",name:"Open book",sets:"8/sida",tip:"Låt rörelsen komma från bröstryggen.",desc:"Ligg på sidan med böjda knän, öppna översta armen bakåt och följ handen med blicken.",emoji:"📖"},{id:"hipflex",name:"Höftböjarstretch",sets:"30 sek/sida",tip:"Spänn sätet lätt och undvik att svanka.",desc:"Stå i halvknästående med mjukt underlag och för höften försiktigt framåt.",emoji:"🧘"},{id:"figure4",name:"Figur 4-stretch",sets:"30 sek/sida",tip:"Känn milt drag i sätet, inte smärta.",desc:"Ligg på rygg, lägg ena vristen över motsatt knä och dra försiktigt benet mot dig.",emoji:"🧘"},{id:"door",name:"Bröststretch i dörröppning",sets:"30 sek/sida",tip:"Undvik att pressa axeln till ytterläge.",desc:"Placera underarmen mot dörrkarmen och vrid kroppen lätt bort.",emoji:"🚪"},{id:"ankle",name:"Fotledsrörlighet mot vägg",sets:"10/sida",tip:"Håll hälen kvar i golvet.",desc:"Stå framför en vägg och för knät mot väggen utan att lyfta hälen.",emoji:"🦶"}];
const plans={a:{title:'Helkropp A',type:'strength',ids:['legpress','chest','row','rdl','deadbug']},b:{title:'Helkropp B',type:'strength',ids:['squat','pulldown','shoulder','curl','pushup']},warm:{title:'Golfuppvärmning · 5–7 min',type:'mobility',ids:['thoracic','hipcircles','armcircles','legswings','swings']},mob:{title:'Golfrörlighet hemma · 8–10 min',type:'mobility',ids:['openbook','hipflex','figure4','door','ankle']}};
const KEY='formresan_training_v14';let state={sessions:[]};try{const saved=JSON.parse(localStorage.getItem(KEY));if(saved&&Array.isArray(saved.sessions))state=saved}catch{};let current='a';const $=id=>document.getElementById(id),get=id=>EXERCISES.find(e=>e.id===id);const today=()=>{let d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};const escapeHTML=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function persist(){try{localStorage.setItem(KEY,JSON.stringify(state));return true}catch(e){alert('Kunde inte spara. Kontrollera lagringsutrymmet.');return false}}function latest(id){return [...state.sessions].reverse().flatMap(s=>s.exercises||[]).find(x=>x.id===id&&x.sets&&x.sets.length)}function guideOpen(id){let x=get(id);$('guideBody').innerHTML=`<h2>${escapeHTML(x.name)}</h2><img class="pic" src="${x.id}.svg" alt="Symbolisk illustration av ${escapeHTML(x.name)}"><p>${escapeHTML(x.desc)}</p><p class="tip">💡 ${escapeHTML(x.tip)}</p><p class="tag">Bilden är en symbolisk översikt, inte en demonstration av tekniken.</p>`;$('guide').showModal()}function render(){const p=plans[current];document.querySelectorAll('[data-r]').forEach(b=>b.classList.toggle('active',b.dataset.r===current));let h=`<div class="card"><div class="row"><h2>${p.title}</h2><span class="tag">${p.ids.length} övningar</span></div><p class="muted small">Tryck på övningens namn för bild och tekniktips.</p>`;for(let id of p.ids){let x=get(id),prev=latest(id);h+=`<div class="exercise"><div class="row"><button class="secondary" onclick="guideOpen('${id}')">📖 ${escapeHTML(x.name)}</button><span class="tag">${x.sets}</span></div>`;if(p.type==='strength'){h+=`<div class="counter">${prev?'Senast: '+prev.sets.map(s=>s.kg+' kg × '+s.reps).join(' · '):'Ingen tidigare registrering'}</div><div class="sets" id="sets-${id}">`;for(let n=0;n<2;n++)h+=setHtml(id,n,prev?.sets[n]);h+=`</div><button class="secondary" onclick="addSet('${id}')">+ Set</button>`}else{h+=`<label class="row" style="justify-content:flex-start;margin-top:12px"><input class="check" type="checkbox" id="done-${id}"> Klar</label>`}h+='</div>'}h+=`<button onclick="saveSession()">💾 Spara ${p.type==='strength'?'gympass':'rutin'}</button></div>`;$('content').innerHTML=h;renderHistory()}
function setHtml(id,n,prev){return `<div class="set"><label>Vikt (kg)<input type="number" inputmode="decimal" min="0" step="0.5" placeholder="kg" class="kg" value="${prev?.kg??''}"></label><label>Reps<input type="number" inputmode="numeric" min="1" max="100" step="1" placeholder="reps" class="reps" value="${prev?.reps??''}"></label><span class="tag">Set ${n+1}</span></div>`}function addSet(id){let el=$('sets-'+id);let n=el.children.length;el.insertAdjacentHTML('beforeend',setHtml(id,n))}function saveSession(){const p=plans[current],exercises=[];for(let id of p.ids){if(p.type==='strength'){let sets=[...$('sets-'+id).children].map(row=>({kg:Number(row.querySelector('.kg').value),reps:Number(row.querySelector('.reps').value),valid:row.querySelector('.kg').value!==''&&row.querySelector('.reps').value!==''})).filter(s=>s.valid).map(({kg,reps})=>({kg,reps}));if(sets.some(s=>!Number.isFinite(s.kg)||s.kg<0||!Number.isInteger(s.reps)||s.reps<1||s.reps>100))return alert('Kontrollera vikt och repetitioner');if(sets.length)exercises.push({id,sets})}else if($('done-'+id).checked)exercises.push({id,done:true})}if(!exercises.length)return alert('Registrera minst en övning först.');state.sessions.push({id:Date.now(),date:today(),plan:current,exercises});if(persist()){alert('Sparat! Grymt jobbat 💙');render()}}function renderHistory(){$('history').innerHTML=state.sessions.length?[...state.sessions].reverse().slice(0,12).map(s=>`<div class="history"><b>${escapeHTML(plans[s.plan]?.title||s.plan)}</b> <span class="tag">${escapeHTML(s.date)}</span><div class="tag">${s.exercises.map(e=>escapeHTML(get(e.id)?.name||e.id)).join(' · ')}</div></div>`).join(''):'<p class="muted small">Inga träningspass sparade ännu.</p>'}function download(){let blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='formresan-traning-'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}document.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{current=b.dataset.r;render()});render();
</script></body></html>
